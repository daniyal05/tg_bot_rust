[package]
name = "weather_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros"] }
pretty_env_logger = "0.5.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde_json = "1.0.151"
